# Keeps the SHA-pinned GitHub Actions (see .github/workflows/*) up to date.
# Actions are pinned to immutable commit SHAs for supply-chain safety; Dependabot
# understands the `# vX.Y.Z` version comment and opens a reviewable PR that bumps
# both the SHA and the comment when a new release ships — so pinning does not mean
# going stale.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week for routine action updates instead of many.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # v2 is a breaking rewrite of the inputs/token handling our release.yml
      # relies on; the migration is deliberate work, tracked in #367. Without
      # this, the group PR re-proposes the major every week.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]

  # npm dependencies across the pnpm workspace. Security updates matter most
  # here; routine bumps arrive as one weekly PR per dependency group.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      # The router devtools import internals of @tanstack/router-core and only
      # work with the router minor they were released for; bumping them alone
      # (1.125 → 1.167 in the October group) broke Vite's pre-bundling and
      # with it the dev server and the E2E suite. They move together with
      # @tanstack/react-router in @oc-mui/router — a deliberate bump, not a
      # routine one.
      - dependency-name: "@tanstack/router-devtools"
      # React ≥ 19.2 logs a console error for the theme <script> next-themes
      # 0.4.6 renders, and the E2E smoke test asserts zero console errors.
      # Upstream fix pending (pacocoursey/next-themes #385/#387/#397); the
      # React line is held at 19.1 via pnpm.overrides until the theme
      # provider no longer renders a script. Then drop this and the override.
      - dependency-name: "react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor"]
    # Majors stay individual PRs so a breaking bump is reviewed on its own.
    commit-message:
      prefix: "chore(deps)"
