# Keeps the SHA-pinned GitHub Actions (see .github/workflows/*) up to date.
# Actions are pinned to immutable commit SHAs for supply-chain safety; Dependabot
# understands the `# vX.Y.Z` version comment and opens a reviewable PR that bumps
# both the SHA and the comment when a new release ships — so pinning does not mean
# going stale.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week for routine action updates instead of many.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  # npm dependencies across the pnpm workspace. Security updates matter most
  # here; routine bumps arrive as one weekly PR per dependency group.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      # The router devtools import internals of @tanstack/router-core and only
      # work with the router minor they were released for; bumping them alone
      # (1.125 → 1.167 in the October group) broke Vite's pre-bundling and
      # with it the dev server and the E2E suite. They move together with
      # @tanstack/react-router in @oc-mui/router — a deliberate bump, not a
      # routine one.
      - dependency-name: "@tanstack/router-devtools"
      # React 19.3 makes the production build roughly four times slower on
      # WebKit (Safari, iPad): the browser matrix went from 150 passed in
      # 2.4 min to 11 failed / 28 flaky in 10 min, bisected to the 19.3 bump
      # alone (same code on 19.1 and 19.2 is green). Held at 19.2 via
      # pnpm.overrides until a React release fixes it; re-test by dispatching
      # matrix.yml with --project=webkit --project=tablet-ios on a probe
      # branch before lifting this. See docs/reference/open-followups.md §11.
      - dependency-name: "react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor"]
    # Majors stay individual PRs so a breaking bump is reviewed on its own.
    commit-message:
      prefix: "chore(deps)"
