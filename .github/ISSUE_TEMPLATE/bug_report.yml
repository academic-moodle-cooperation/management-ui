name: 🐛 Bug report
description: Something in Management UI behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more we know up-front, the
        faster we can reproduce and fix it.

        If this is a **security issue**, do not file it here — use
        [private vulnerability reporting](https://github.com/academic-moodle-cooperation/management-ui/security/advisories)
        instead.

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The commit SHA you're running, or the version of the tagged release.
      placeholder: "e.g. abc1234 (commit SHA) or v1.0.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What you thought would happen instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal, ordered steps that reproduce the bug. Include the config used (sanitised) if relevant.
      placeholder: |
        1. Start the shell with `pnpm dev`.
        2. Navigate to `/episodes`.
        3. Click "Upload".
        4. Observe …
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Which part of Management UI is affected?
      multiple: true
      options:
        - Shell (apps/shell)
        - Core plugin infrastructure (plugins/core)
        - Core plugin — core-episodes
        - Core plugin — core-series
        - Core plugin — core-upload
        - Example plugin (plugins/example)
        - Admin Marketplace
        - A third-party / local plugin
        - Plugin runtime / loader
        - GraphQL / data layer
        - Routing / authentication
        - Build / CI / tooling
        - Docs
        - Other (please describe)
    validations:
      required: true

  - type: dropdown
    id: oldest-affected-major
    attributes:
      label: Oldest affected Opencast major
      description: |
        The oldest Opencast major this bug affects. This determines which release
        line (`r/NN.x`) the fix has to land on — fixes target the line of the
        oldest affected major and roll forward from there.
      options:
        - "19 — affects all supported majors"
        - "20 — OC 20 and newer only"
        - "Unsure"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console + server logs (if any)
      description: |
        Paste relevant errors and stack traces. Redact anything sensitive
        (tokens, user data) first.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version (`node -v`), pnpm version (`pnpm -v`), Opencast version (if relevant).
      placeholder: |
        Browser: Chrome 137
        OS: macOS 14.4
        Node: 22.4.0
        pnpm: 10.28.0
        Opencast backend: 16.5
    validations:
      required: true
