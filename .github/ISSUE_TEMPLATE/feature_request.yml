name: ✨ Feature request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. The more concrete the use case, the
        easier it is to evaluate.

        If your proposal is about **plugin extensibility** (a new extension
        point, a contract change, a hook), please mention that explicitly —
        contract changes follow the
        [Contract Change Process](https://github.com/academic-moodle-cooperation/management-ui/blob/develop/docs/architecture/CONTRACTS.md#contract-change-process)
        (dated changelog entry + changeset; an ADR for major bumps — see
        [CONTRIBUTING.md](https://github.com/academic-moodle-cooperation/management-ui/blob/develop/CONTRIBUTING.md#versioning-changesets-and-deprecations)).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user scenario or workflow that's currently painful.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Be as concrete as you can.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: How would we know it's done?
      description: |
        If you can, sketch what "working" looks like from a user's side — the
        behaviour you'd expect to see. This becomes the acceptance criteria when
        the work is picked up. Rough bullets are fine; leave blank if unsure.
      placeholder: |
        - A deployment can set an admin role in config.json and the marketplace
          respects it.
        - Non-admins don't see the marketplace nav entry at all.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Other approaches you thought about and why you didn't pick them.
        "I tried doing this as a plugin and ran into …" is a great answer.

  - type: dropdown
    id: scope
    attributes:
      label: Which area would this touch? (if you know)
      description: Best guess is fine — it just helps us route and label. Leave blank if unsure.
      multiple: true
      options:
        - Shell (apps/shell)
        - A shared package (packages/*)
        - Core plugin infrastructure (plugins/core)
        - Core plugin — core-episodes
        - Core plugin — core-series
        - Core plugin — core-upload
        - Example plugin (plugins/example)
        - Admin Marketplace
        - Plugin extensibility (new extension point / contract)
        - Plugin runtime / loader
        - GraphQL / data layer
        - Routing / authentication
        - Build / CI / tooling
        - Docs
        - Not sure

  - type: dropdown
    id: oldest-affected-major
    attributes:
      label: Oldest affected Opencast major (if you know)
      description: |
        The oldest Opencast major that needs this. It determines which release
        line (`r/NN.x`) the feature lands on. Best guess is fine — leave blank
        if unsure; most new features simply target the next major (`develop`).
      options:
        - "19 — needed on all supported majors"
        - "20 — OC 20 and newer only"
        - "Unsure"

  - type: dropdown
    id: would-author
    attributes:
      label: Would you be willing to author this?
      options:
        - "Yes — I can open a PR"
        - "Yes — with mentorship"
        - "No, just requesting"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, anything else.
