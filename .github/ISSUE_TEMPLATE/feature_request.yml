name: ✨ Feature request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. The more concrete the use case, the
        easier it is to evaluate.

        If your proposal is about **plugin extensibility** (a new extension
        point, a contract change, a hook), please mention that explicitly —
        contract changes need an ADR and a changeset (see
        [CONTRIBUTING.md](../CONTRIBUTING.md#-versioning-changesets-and-deprecations)).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user scenario or workflow that's currently painful.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Be as concrete as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Other approaches you thought about and why you didn't pick them.
        "I tried doing this as a plugin and ran into …" is a great answer.

  - type: dropdown
    id: would-author
    attributes:
      label: Would you be willing to author this?
      options:
        - "Yes — I can open a PR"
        - "Yes — with mentorship"
        - "No, just requesting"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, anything else.
