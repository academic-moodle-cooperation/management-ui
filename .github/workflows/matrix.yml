name: Browser matrix (E2E)

# The cross-browser tier. Per-PR CI runs the same specs on chromium only
# (test.yml) so the gate stays fast; this workflow adds the other engines.
#
# Those engines are the manual test protocol's per-browser result columns, which
# a human used to walk one at a time. See docs/contribute/testing.md and
# tests/protocol/README.md.
#
# Runner-minute budget drove three decisions:
#
#  * **No schedule.** These specs break when code changes, not when time passes,
#    so a nightly run mostly re-tests an unchanged tree. It runs on merge into a
#    long-lived branch instead — the moment a cross-browser regression can
#    actually enter — and on demand before a release.
#  * **One job, not one per engine.** Five jobs meant five full workspace builds.
#    Sequential projects in a single job cost roughly one build instead of five;
#    the wall clock is longer, but nothing is waiting on this.
#  * **No desktop-chromium project here.** test.yml already runs every one of
#    these specs on chromium for each PR. Repeating it would be a fifth of the
#    bill for zero new information. `pnpm test:matrix` locally still runs all
#    five. Note this is about the *project*, not the *binary*: tablet-android is
#    a Chromium device descriptor, so the chromium browser still gets installed.

on:
  push:
    branches:
      # The long-lived branches of the Opencast-style model (release.md ->
      # "Branching model"): `develop` integrates, the `r/NN.x` lines ship.
      # There is no `main`.
      - develop
      - "r/**"
    paths-ignore:
      # A push that only touches prose cannot change how a browser renders the
      # app, and this run costs ~16 minutes. GitHub skips the workflow only when
      # *every* changed path matches, so a mixed docs+code merge still runs.
      - "docs/**"
      - "**/*.md"
      - ".changeset/**"
      - ".github/ISSUE_TEMPLATE/**"
      - LICENSE
  workflow_dispatch:
    inputs:
      projects:
        description: "Projects to run (space-separated --project args). Default: every non-chromium project."
        required: false

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Firefox / WebKit / tablets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SDK (dist + dist-types)
        run: |
          # Same ordering guard as the e2e job in test.yml: dist is the canonical
          # entry point, so vite-config must build before the rest.
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "❌ vite-config dist files missing" && exit 1)
          pnpm turbo run build build:types

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Install Playwright browsers
        # Via the package.json script, so this can't drift from what a local
        # `pnpm test:matrix` needs.
        #
        # It installs chromium too, and that is NOT redundant with "no chromium
        # project here": `tablet-ios` emulates an iPad on WebKit, but
        # `tablet-android` is a Galaxy Tab S4 — a *Chromium* device descriptor.
        # Without the chromium binary every tablet-android spec dies on browser
        # launch, ~4 ms in, which is what had this workflow red on develop.
        run: pnpm test:matrix:install

      - name: Run the browser matrix
        run: |
          pnpm test:matrix ${PROJECTS:---project=firefox --project=webkit --project=tablet-android --project=tablet-ios}
        env:
          PROJECTS: ${{ github.event.inputs.projects }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-matrix
          path: playwright-report-matrix/
          retention-days: 7
