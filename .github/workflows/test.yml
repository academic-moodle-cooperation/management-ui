name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          # Force rebuild to ensure all packages are built correctly
          # This prevents issues where cached builds might have missing exports
          # (e.g., vite-config dist files not being available for plugins)
          pnpm turbo run build --force

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: |
          # Run type check and filter out shadcn/ui errors (auto-generated files)
          # See docs/internal/SHADCN_TYPESCRIPT_ERRORS.md for details
          pnpm check-types 2>&1 | grep -v "packages/ui/src/components/ui" | grep -v "src/components/ui" || true
          # Check if there are any real errors (not shadcn-related)
          if pnpm check-types 2>&1 | grep -v "packages/ui/src/components/ui" | grep -v "src/components/ui" | grep -q "error TS"; then
            echo "❌ Real TypeScript errors found (not shadcn-related)"
            exit 1
          else
            echo "✅ Type check passed (shadcn errors ignored)"
          fi

      - name: Run tests
        run: pnpm test

      - name: Generate coverage report
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
