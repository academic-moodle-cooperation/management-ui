name: Test

# Docs-only changes skip this heavy gate entirely (path filters below): they
# are covered by the docs fast path in docs.yml (site build + markdownlint +
# offline link check) instead. The changeset gate is NOT affected —
# changeset.yml has no path filter, so a PR that only touches a versioned
# package's *.md files still gets its changeset requirement enforced.
#
# The filters use `paths` with negations (last matching pattern wins) instead
# of `paths-ignore`, because one class of markdown must NEVER skip the gate:
# packages/*/etc/*.api.md are generated API snapshots that api-check validates —
# a hand-edited snapshot slipping through an "md-only" PR would poison the
# baseline and fail the next unrelated code PR.
on:
  push:
    branches: [develop, "r/**"]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "packages/**/etc/*.api.md"
  pull_request:
    branches: [develop, "r/**"]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "packages/**/etc/*.api.md"

jobs:
  lint-types:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          # Build vite-config first to ensure dist files are fully available.
          # Prevents race conditions where plugins try to use vite-config before it's fully built.
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "❌ vite-config dist files missing" && exit 1)
          pnpm turbo run build --force

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm check-types

      # Regenerate the GraphQL codegen output from the COMMITTED schema and
      # fail on any diff — committed inputs and outputs cannot drift apart
      # (#355/#360). Also runs the consumer-perspective type check over the
      # built dist-types (#354). Needs no backend: the schema is a file.
      - name: Codegen drift + consumer types
        run: pnpm codegen:check

  unit:
    name: Unit tests
    needs: lint-types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "❌ vite-config dist files missing" && exit 1)
          pnpm turbo run build --force

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Run unit tests
        run: pnpm test

      - name: Generate coverage report
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  contract:
    name: Plugin contract tests
    needs: unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "❌ vite-config dist files missing" && exit 1)
          pnpm turbo run build --force

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Run contract tests
        run: pnpm test:contract

  api-check:
    name: API surface drift
    needs: unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "❌ vite-config dist files missing" && exit 1)
          pnpm turbo run build --force

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Verify .api.md snapshots are up to date
        # api-check:ci runs api-extractor without --local: it compares the
        # generated report against the committed etc/<pkg>.api.md and exits
        # non-zero if they differ. Authors regenerate locally with
        # `pnpm api-check`.
        run: pnpm api-check:ci

  e2e:
    name: E2E (Playwright)
    needs: unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SDK (dist + dist-types)
        run: |
          # The Playwright webServer starts the shell in dev mode. Since dist is
          # the canonical entry point, any @oc-mui/* import not covered by the
          # shell's dev src-aliases resolves to dist/ — so the SDK must be built;
          # dev no longer works on a fully unbuilt tree. vite-config first as
          # the ordering guard, then the full build.
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "❌ vite-config dist files missing" && exit 1)
          pnpm turbo run build build:types

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
