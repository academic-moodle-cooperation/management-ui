name: Release

# Changesets release automation (see docs/contribute/release.md -> "Cutting a release").
#
# Branching model (Opencast-style, no `main`): development lands on `develop`;
# releases happen on `r/NN.x` release lines named after the Opencast major the
# line targets (e.g. r/19.x). Cutting a release = pushing the release line (new
# or updated). On every push to `r/**` this job either:
#   1. opens/updates a "Version Packages" PR (against that r/ branch) that
#      aggregates the pending .changeset/*.md files into version bumps +
#      changelog edits, OR
#   2. (once that PR is merged and no changesets remain) runs
#      `pnpm changeset:publish` to publish the bumped packages, push the
#      per-package tags, and create the product tag `v$(cat VERSION)` + a
#      GitHub Release.
#
# Maven flow (docs/contribute/release.md step 4): the branch always carries
# `-SNAPSHOT` poms. On the release leg the job makes a RELEASE COMMIT on top of
# the branch tip (VERSION, Opencast parent MAJOR.MINOR, no -SNAPSHOT), deploys the
# signed JARs from it to the AMC Maven repository (secrets MVN_DEPLOY_USER,
# MVN_DEPLOY_PASSWORD, MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE), tags it - the
# commit lives only under that tag, never on a branch - and finally commits the
# next development version (-SNAPSHOT) to the branch.
#
# Two JAR streams, ONE npm stream (issue #236): only the NEWEST r/NN.x line
# publishes the @oc-mui/* packages. The TypeScript is identical across lines
# (they differ only in build metadata), so letting every line publish would
# race the same package versions onto npm. Older lines still get their
# Version PR, per-package git tags (`changeset git-tag`), the product tag and a
# GitHub Release — they ship as JARs, not through npm. The "which line am I"
# check is computed below from the live list of r/* branches.
#
# Required before this can actually publish:
#   - Repo setting: Settings -> Actions -> General -> "Allow GitHub Actions to
#     create and approve pull requests" must be ON (for the Version PR).
#   - Authentication is tokenless via npm Trusted Publishing (OIDC) - there is
#     NO NPM_TOKEN secret. Each @oc-mui/* package needs a Trusted Publisher
#     configured on npmjs.com (Package -> Settings -> Trusted Publisher ->
#     GitHub Actions) naming this repo + this workflow file. OIDC needs npm
#     >= 11.5.1 and Node >= 22.14.0 (the Setup Node + npm-upgrade steps below).
#   - FIRST-PUBLISH BOOTSTRAP: OIDC cannot publish a package that does not yet
#     exist on the registry (npm/cli#8544, still open). Each @oc-mui/* package
#     must be published once by other means first - use a local `pnpm publish -r`
#     while signed in (`npm login`; no CI token), NOT `npm publish`: pnpm rewrites
#     the `workspace:*` deps to real version ranges, which plain npm does not.
#     (The published entry points are dist-canonical, so that half is fine either
#     way.) Only then can each Trusted Publisher be configured. Every release
#     after that flows through this workflow tokenlessly, with provenance
#     attestations generated automatically.

on:
  workflow_dispatch:
  push:
    branches: ["r/**"]

# Let the action push the Version Packages branch and open its PR.
# id-token lets npm Trusted Publishing (OIDC) authenticate the publish once
# it is configured on the packages - the post-bootstrap, tokenless end state
# (see docs/contribute/release.md -> "npm authentication").
permissions:
  contents: write
  pull-requests: write
  id-token: write

# Never run two releases concurrently against the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # Never run from a fork.
    # Fork guard + branch guard: releases only ever run on r/NN.x lines. The
    # branch condition matters for `workflow_dispatch`, which can be started
    # from ANY branch — dispatched on develop, the "not an r-branch" path would
    # otherwise treat develop as the newest line and, in a changeset-free
    # moment, publish from it.
    if: github.repository == 'academic-moodle-cooperation/management-ui' && startsWith(github.ref, 'refs/heads/r/')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so changesets can compute version bumps + changelogs.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # >= 22.14.0 is required for npm Trusted Publishing (OIDC).
          node-version: "22"
          cache: "pnpm"
          # No registry-url: it writes an .npmrc whose _authToken references
          # NODE_AUTH_TOKEN, which does not exist here (publishing is OIDC).
          # npm still publishes tokenless, but with that dangling token every
          # `npm view` inside `changeset publish` fails, so changesets believes
          # nothing is published yet, republishes every package, and the run
          # fails on "cannot publish over previously published versions" after
          # the genuinely new package already went out (second release, 20.1.1).

      - name: Upgrade npm for OIDC trusted publishing
        # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x, so the
        # `changeset publish` step (which shells out to `npm publish`) would
        # otherwise use too old an npm to exchange the OIDC token.
        run: npm install -g npm@11 # NOT @latest: npm 12 wraps `npm info --json` in an array, which changesets cannot read (second release, 20.1.1)

      - name: Determine release-line role
        id: line
        # newest=true  -> this line publishes npm (plus tags + release)
        # newest=false -> JAR-only line: version + git tags + release, NO npm
        # Also records whether changesets are pending at the start of the run:
        # "none pending" means this run is the post-Version-PR release leg.
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          THIS_MAJOR="$(echo "${BRANCH}" | sed -n 's|^r/\([0-9]\{1,\}\)\.x$|\1|p')"
          if [ -z "${THIS_MAJOR}" ]; then
            echo "Not an r/NN.x branch (${BRANCH}) — treating as newest." >&2
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            NEWEST_MAJOR="$(git ls-remote --heads origin 'r/*' \
              | sed -n 's|.*refs/heads/r/\([0-9]\{1,\}\)\.x$|\1|p' \
              | sort -n | tail -1)"
            if [ "${THIS_MAJOR}" -ge "${NEWEST_MAJOR:-0}" ]; then
              echo "newest=true" >> "$GITHUB_OUTPUT"
            else
              echo "newest=false" >> "$GITHUB_OUTPUT"
            fi
            echo "This line: r/${THIS_MAJOR}.x — newest existing: r/${NEWEST_MAJOR}.x"
          fi
          if ls .changeset/*.md 2>/dev/null | grep -qv README; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Build the SDK (dist + dist-types)
        run: |
          # vite-config first (ordering guard - other packages import its dist),
          # then the full build INCLUDING build:types - publishConfig points
          # `types` at dist-types/, which only build:types emits.
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "vite-config dist files missing" && exit 1)
          pnpm turbo run build build:types

      - name: Forward-merge gate (older lines only)
        # The one silent trap of the multi-line flow: releasing an OLDER line
        # before its changesets reached the newer lines. The Version PR deletes
        # the .changeset files it consumes; forward-merging that deletion later
        # makes the newer lines ship the change WITHOUT a bump or changelog
        # entry. version-pr-guard.yml checks this on the Version PR, but PRs
        # opened with the workflow token get no workflow runs, so this is the
        # enforced copy: it runs on the push that merged the Version PR and
        # aborts BEFORE anything is tagged or published.
        if: steps.line.outputs.newest == 'false' && steps.line.outputs.pending == 'false'
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          THIS_MAJOR="$(echo "${BRANCH}" | sed -n 's|^r/\([0-9]\{1,\}\)\.x$|\1|p')"
          # Changesets consumed by the commit just pushed (the Version PR merge):
          # the .changeset/*.md files it deleted relative to its first parent.
          CONSUMED="$(git diff --name-only --diff-filter=D HEAD~1 HEAD -- '.changeset/*.md' | grep -v README || true)"
          if [ -z "${CONSUMED}" ]; then
            echo "This push consumed no changesets — nothing to gate."
            exit 0
          fi
          NEWER_LINES="$(git ls-remote --heads origin 'r/*' \
            | sed -n 's|.*refs/heads/\(r/[0-9]\{1,\}\.x\)$|\1|p' \
            | awk -F'[/.]' -v m="${THIS_MAJOR}" '$2 > m {print $0}')"
          MISSING=0
          for line in ${NEWER_LINES}; do
            git fetch origin "${line}" --quiet
            for f in ${CONSUMED}; do
              # Line-only changesets never travel upward by design: an EMPTY
              # changeset (no package in its front matter, e.g. the placeholder
              # a post-release sync needs) and one whose text carries the
              # `line-only` marker (a line's own schema pin, say).
              CONTENT="$(git show "HEAD~1:${f}")"
              DECLARED="$(printf '%s\n' "${CONTENT}" | awk '/^---$/{c++; next} c==1' | grep -c ':' || true)"
              if [ "${DECLARED}" = "0" ] || printf '%s\n' "${CONTENT}" | grep -qi 'line-only'; then
                echo "${f}: line-only changeset — not expected on ${line}."
                continue
              fi
              # Present on the newer line, or already consumed there (it was in
              # that line's history at some point) — both mean it got there.
              if git cat-file -e "origin/${line}:${f}" 2>/dev/null \
                 || [ -n "$(git log -1 --format=%h "origin/${line}" -- "${f}")" ]; then
                continue
              fi
              echo "::error::${f} never reached ${line}. Releasing r/${THIS_MAJOR}.x now would carry its deletion upward and ship the change there without a version bump."
              MISSING=1
            done
          done
          if [ "${MISSING}" -ne 0 ]; then
            echo "Forward-merge r/${THIS_MAJOR}.x upward first (oldest line to newest), then re-run."
            exit 1
          fi
          echo "Every consumed changeset reached the newer line(s) — safe to release."

      - name: Create Version PR or publish
        id: changesets
        # v2 of the action (Changesets CLI 3): inputs renamed (version-script,
        # publish-script, commit-message, pr-title), the token is an input, and
        # the Version branch is pushed through the GitHub API instead of the
        # git CLI. Published-package detection reads the CHANGESETS_OUTPUT file
        # the CLI writes, so `pnpm changeset:publish` must stay a plain
        # `changeset publish` (env is inherited). Migration: #367.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          # Runs on the merged Version PR when no changesets remain. Only the
          # newest line publishes npm (which also creates the per-package git
          # tags). An older line must NOT run `changeset git-tag` either: both
          # lines carry the SAME package versions (the TS is identical), and a
          # git tag name can exist only once — whichever line released second
          # would fail pushing colliding tags. Older lines therefore get only
          # their product tag + GitHub Release (next step). The placeholder
          # script writes no Changesets output file, which the action reports
          # as a warning ("no GitHub releases / tags") — expected on that leg.
          publish-script: ${{ steps.line.outputs.newest == 'true' && 'pnpm changeset:publish' || 'node -e "console.log(String.raw`JAR-only line - npm publish and package tags are the newest line s job.`)"' }}
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # For the action only (push the Version branch + open its PR).
          # Publishing itself is tokenless: npm authenticates to the registry
          # via the OIDC `id-token` granted above - no NPM_TOKEN.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-flight for the Maven release
        # Decides whether this push needs a release and checks that it can be
        # published, BEFORE anything is built or tagged.
        #   tagged=true    v<VERSION> already exists: this version is released
        #                  (a forward merge, a re-run). release=false, no deploy.
        #   release=true   no tag yet: the release commit is created, published
        #                  and tagged below. Hard failures here: VERSION is not
        #                  semver, or the Opencast parent `MAJOR.MINOR` of
        #                  VERSION is not in the AMC repository (publish it
        #                  there first).
        #   publish        false when the release is already in the repository.
        #                  The probe targets the feature pom - the LAST module
        #                  deployed - not the root pom, so a half-published
        #                  release is not mistaken for a finished one. Only a
        #                  404 means "not published"; any other status fails.
        if: steps.line.outputs.pending == 'false'
        id: maven
        run: |
          VERSION="$(cat VERSION)"
          PRODUCT_TAG="v${VERSION}"
          REPO="https://mvn.academic-moodle-cooperation.org/releases"
          status() { curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors -I "$1"; }

          if git rev-parse -q --verify "refs/tags/${PRODUCT_TAG}" >/dev/null || \
             git ls-remote --exit-code --tags origin "${PRODUCT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${PRODUCT_TAG} already exists - ${VERSION} is released, nothing to publish."
            { echo "tagged=true"; echo "release=false"; echo "publish=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION is not semver: '${VERSION}'."
            exit 1
          fi
          PIN="$(echo "${VERSION}" | cut -d. -f1,2)"
          PARENT_STATUS="$(status "${REPO}/org/opencastproject/base/${PIN}/base-${PIN}.pom")"
          if [ "${PARENT_STATUS}" != "200" ]; then
            echo "::error::Opencast parent org.opencastproject:base:${PIN} is not in ${REPO} (HTTP ${PARENT_STATUS}). Publish it there before releasing ${VERSION}."
            exit 1
          fi

          FEATURE_STATUS="$(status "${REPO}/org/amc/management/assemblies/management-ui-feature/${VERSION}/management-ui-feature-${VERSION}.pom")"
          case "${FEATURE_STATUS}" in
            200) echo "management-ui ${VERSION} is already in the Maven repository - skipping the deploy."
                 PUBLISH=false ;;
            404) PUBLISH=true ;;
            *)   echo "::error::Unexpected HTTP ${FEATURE_STATUS} probing ${REPO} for ${VERSION}."
                 exit 1 ;;
          esac
          { echo "tagged=false"; echo "release=true"; echo "publish=${PUBLISH}"; } >> "$GITHUB_OUTPUT"

      - name: Create the release commit (stays off the branch)
        # The branch keeps its `-SNAPSHOT` poms. The release commit is a child
        # of the branch tip made in this job only: poms in release state
        # (project version = VERSION, Opencast parent + opencast.version =
        # MAJOR.MINOR, no `-SNAPSHOT`). It is built, published and TAGGED, but
        # never pushed to a branch - the tag is its only ref.
        if: steps.maven.outputs.release == 'true'
        run: |
          VERSION="$(cat VERSION)"
          PIN="$(echo "${VERSION}" | cut -d. -f1,2)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q --detach
          node scripts/update-maven-versions.mjs --release
          if LEFT="$(git grep -n -e '-SNAPSHOT' -- 'pom.xml' '**/pom.xml' ':!**/templates/**')"; then
            echo "::error::The release commit must not contain -SNAPSHOT, but found:"
            echo "${LEFT}"
            exit 1
          fi
          PARENT_PIN="$(sed -n '/<parent>/,/<\/parent>/p' pom.xml | grep -o '<version>[^<]*' | cut -c10-)"
          if [ "${PARENT_PIN}" != "${PIN}" ]; then
            echo "::error file=pom.xml::Opencast parent is '${PARENT_PIN}', expected '${PIN}' (MAJOR.MINOR of ${VERSION})."
            exit 1
          fi
          if ! git diff --quiet; then
            git commit -q -a -m "chore(release): ${VERSION}"
          fi
          echo "Release commit $(git rev-parse --short HEAD) on top of ${GITHUB_SHA::7} (not pushed to any branch)."

      - name: Setup Java for Maven
        if: steps.maven.outputs.publish == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test the JARs (no secrets in the environment)
        # Everything that runs third-party code (pnpm install, the frontend
        # build, the unit tests) happens here, BEFORE the deploy credentials and
        # the signing key are available.
        if: steps.maven.outputs.publish == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Configure Maven credentials and import the signing key
        # A second setup-java run, only now: it writes ~/.m2/settings.xml with a
        # <server> for the releases repo (credentials are read from the env vars
        # named here at deploy time) and imports the GPG key into the keyring.
        if: steps.maven.outputs.publish == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          server-id: amc-releases
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Sign and publish to the AMC Maven repository
        # The only step that sees the secrets. It does not rebuild: tests are
        # skipped and the pnpm/frontend executions are skipped (the shell's
        # `dist/` and the installed node from the build step above are reused),
        # so no dependency or build script runs next to the credentials.
        # `-Prelease` signs every artifact with the imported key (verify phase);
        # `deployAtEnd` uploads nothing until ALL modules built and were signed,
        # so a failure never leaves a half-uploaded release behind.
        if: steps.maven.outputs.publish == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MVN_DEPLOY_USER }}
          MAVEN_PASSWORD: ${{ secrets.MVN_DEPLOY_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -Prelease -DdeployAtEnd=true -DskipTests
          -Dskip.installnodepnpm=true -Dskip.pnpm=true -Dexec.skip=true
          deploy

      - name: Product tag + GitHub Release
        # Tags the RELEASE COMMIT (v<VERSION file>, e.g. v19.0.0) - the commit
        # with release poms made above, which is not on any branch - and creates
        # a GitHub Release with generated notes. Deployments (sources.yml etc.)
        # pin this tag. Runs on the release leg of BOTH kinds of line (newest
        # and JAR-only). The tag comes AFTER the deploy: a tag means "published",
        # and a failed deploy is simply retried by a re-run. Idempotent: skips
        # if the tag already exists.
        if: steps.maven.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCT_TAG="v$(cat VERSION)"
          if git rev-parse -q --verify "refs/tags/${PRODUCT_TAG}" >/dev/null || \
             git ls-remote --exit-code --tags origin "${PRODUCT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${PRODUCT_TAG} already exists - skipping."
            exit 0
          fi
          git tag "${PRODUCT_TAG}"
          git push origin "refs/tags/${PRODUCT_TAG}"
          # The product version's MAJOR names the targeted Opencast major (the
          # JAR is major-bound via OSGi import ranges), but WHICH exact
          # Opencast the bundles were compiled against is a per-build fact —
          # stamp it into the release notes instead of the version number. On
          # the release commit this is the pinned Opencast (e.g. 20.5).
          OPENCAST_VERSION="$(sed -n 's|.*<opencast.version>\(.*\)</opencast.version>.*|\1|p' pom.xml | head -1)"
          PRODUCT_MAJOR="${PRODUCT_TAG#v}"; PRODUCT_MAJOR="${PRODUCT_MAJOR%%.*}"
          gh release create "${PRODUCT_TAG}" \
            --title "Management UI ${PRODUCT_TAG}" \
            --notes "Built against Opencast \`${OPENCAST_VERSION:-unknown}\` (runs on any Opencast ${PRODUCT_MAJOR} minor — the backend bundles are bound to the major, not a specific minor)." \
            --generate-notes \
            --verify-tag

      - name: Prepare the next development version
        # The Maven convention: the released version is tagged, the branch moves
        # on to the next `-SNAPSHOT` (VERSION's next patch, Opencast pin back to
        # `MAJOR-SNAPSHOT`) as a child of the branch tip - NOT of the release
        # commit, which stays tag-only. Runs after a release in this run, and
        # also when the version was already tagged (a re-run that failed after
        # the tag): the script is a no-op once the poms are already at the next
        # development version. Pushed with the workflow token, which does not
        # trigger another run; if the branch is protected (or moved meanwhile)
        # and the push is rejected, the same commit goes to a PR instead.
        if: steps.maven.outputs.release == 'true' || steps.maven.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git switch -q --detach "${GITHUB_SHA}"
          node scripts/update-maven-versions.mjs --next
          if git diff --quiet; then
            echo "Poms are already at the next development version - nothing to do."
            exit 0
          fi
          NEXT="$(sed -n '/<artifactId>management-ui<\/artifactId>/,/<\/project>/{s|^[[:space:]]*<version>\(.*\)</version>[[:space:]]*$|\1|p}' pom.xml | head -1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -a -m "chore(release): prepare next development version ${NEXT}"
          if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
            echo "Pushed ${NEXT} to ${GITHUB_REF_NAME}."
          else
            PR_BRANCH="chore/next-dev-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
            git push --force origin "HEAD:refs/heads/${PR_BRANCH}"
            gh pr create --base "${GITHUB_REF_NAME}" --head "${PR_BRANCH}" \
              --title "chore(release): prepare next development version ${NEXT}" \
              --body "Post-release: poms to the next development version (${NEXT}, Opencast parent \`MAJOR-SNAPSHOT\`). Opened as a PR because the direct push to \`${GITHUB_REF_NAME}\` was rejected."
          fi
