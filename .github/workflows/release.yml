name: Release

# Changesets release automation (see docs/contribute/release.md -> "Cutting a release").
#
# Branching model (Opencast-style, no `main`): development lands on `develop`;
# releases happen on `r/NN.x` release lines named after the Opencast major the
# line targets (e.g. r/19.x). Cutting a release = pushing the release line (new
# or updated). On every push to `r/**` this job either:
#   1. opens/updates a "Version Packages" PR (against that r/ branch) that
#      aggregates the pending .changeset/*.md files into version bumps +
#      changelog edits, OR
#   2. (once that PR is merged and no changesets remain) runs
#      `pnpm changeset:publish` to publish the bumped packages, push the
#      per-package tags, and create the product tag `v$(cat VERSION)` + a
#      GitHub Release.
#
# Two JAR streams, ONE npm stream (issue #236): only the NEWEST r/NN.x line
# publishes the @oc-mui/* packages. The TypeScript is identical across lines
# (they differ only in build metadata), so letting every line publish would
# race the same package versions onto npm. Older lines still get their
# Version PR, per-package git tags (`changeset tag`), the product tag and a
# GitHub Release — they ship as JARs, not through npm. The "which line am I"
# check is computed below from the live list of r/* branches.
#
# Required before this can actually publish:
#   - Repo setting: Settings -> Actions -> General -> "Allow GitHub Actions to
#     create and approve pull requests" must be ON (for the Version PR).
#   - Authentication is tokenless via npm Trusted Publishing (OIDC) - there is
#     NO NPM_TOKEN secret. Each @oc-mui/* package needs a Trusted Publisher
#     configured on npmjs.com (Package -> Settings -> Trusted Publisher ->
#     GitHub Actions) naming this repo + this workflow file. OIDC needs npm
#     >= 11.5.1 and Node >= 22.14.0 (the Setup Node + npm-upgrade steps below).
#   - FIRST-PUBLISH BOOTSTRAP: OIDC cannot publish a package that does not yet
#     exist on the registry (npm/cli#8544, still open). Each @oc-mui/* package
#     must be published once by other means first - use a local `pnpm publish -r`
#     while signed in (`npm login`; no CI token), NOT `npm publish`: pnpm rewrites
#     the `workspace:*` deps to real version ranges, which plain npm does not.
#     (The published entry points are dist-canonical, so that half is fine either
#     way.) Only then can each Trusted Publisher be configured. Every release
#     after that flows through this workflow tokenlessly, with provenance
#     attestations generated automatically.

on:
  workflow_dispatch:
  push:
    branches: ["r/**"]

# Let the action push the Version Packages branch and open its PR.
# id-token lets npm Trusted Publishing (OIDC) authenticate the publish once
# it is configured on the packages - the post-bootstrap, tokenless end state
# (see docs/contribute/release.md -> "npm authentication").
permissions:
  contents: write
  pull-requests: write
  id-token: write

# Never run two releases concurrently against the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # Never run from a fork.
    # Fork guard + branch guard: releases only ever run on r/NN.x lines. The
    # branch condition matters for `workflow_dispatch`, which can be started
    # from ANY branch — dispatched on develop, the "not an r-branch" path would
    # otherwise treat develop as the newest line and, in a changeset-free
    # moment, publish from it.
    if: github.repository == 'academic-moodle-cooperation/management-ui' && startsWith(github.ref, 'refs/heads/r/')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so changesets can compute version bumps + changelogs.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # >= 22.14.0 is required for npm Trusted Publishing (OIDC).
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing
        # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x, so the
        # `changeset publish` step (which shells out to `npm publish`) would
        # otherwise use too old an npm to exchange the OIDC token.
        run: npm install -g npm@latest

      - name: Determine release-line role
        id: line
        # newest=true  -> this line publishes npm (plus tags + release)
        # newest=false -> JAR-only line: version + git tags + release, NO npm
        # Also records whether changesets are pending at the start of the run:
        # "none pending" means this run is the post-Version-PR release leg.
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          THIS_MAJOR="$(echo "${BRANCH}" | sed -n 's|^r/\([0-9]\{1,\}\)\.x$|\1|p')"
          if [ -z "${THIS_MAJOR}" ]; then
            echo "Not an r/NN.x branch (${BRANCH}) — treating as newest." >&2
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            NEWEST_MAJOR="$(git ls-remote --heads origin 'r/*' \
              | sed -n 's|.*refs/heads/r/\([0-9]\{1,\}\)\.x$|\1|p' \
              | sort -n | tail -1)"
            if [ "${THIS_MAJOR}" -ge "${NEWEST_MAJOR:-0}" ]; then
              echo "newest=true" >> "$GITHUB_OUTPUT"
            else
              echo "newest=false" >> "$GITHUB_OUTPUT"
            fi
            echo "This line: r/${THIS_MAJOR}.x — newest existing: r/${NEWEST_MAJOR}.x"
          fi
          if ls .changeset/*.md 2>/dev/null | grep -qv README; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Build the SDK (dist + dist-types)
        run: |
          # vite-config first (ordering guard - other packages import its dist),
          # then the full build INCLUDING build:types - publishConfig points
          # `types` at dist-types/, which only build:types emits.
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "vite-config dist files missing" && exit 1)
          pnpm turbo run build build:types

      - name: Create Version PR or publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version: pnpm changeset:version
          # Runs on the merged Version PR when no changesets remain. Only the
          # newest line publishes npm (which also creates the per-package git
          # tags). An older line must NOT run `changeset tag` either: both
          # lines carry the SAME package versions (the TS is identical), and a
          # git tag name can exist only once — whichever line released second
          # would fail pushing colliding tags. Older lines therefore get only
          # their product tag + GitHub Release (next step).
          publish: ${{ steps.line.outputs.newest == 'true' && 'pnpm changeset:publish' || 'node -e "console.log(String.raw`JAR-only line - npm publish and package tags are the newest line s job.`)"' }}
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          # GITHUB_TOKEN is for the changesets action (push the Version branch +
          # open its PR). Publishing itself is tokenless: npm authenticates to
          # the registry via the OIDC `id-token` granted above - no NPM_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Product tag + GitHub Release
        # Creates the ops-facing product tag (v<VERSION file>, e.g. v19.0.0)
        # plus a GitHub Release with generated notes. Deployments (sources.yml
        # etc.) pin this tag. Runs on the release leg of BOTH kinds of line:
        # the newest line reports `published` from the npm publish; an older
        # (JAR-only) line never publishes npm, so its release leg is detected
        # as "no changesets were pending when this run started". Idempotent:
        # skips if the tag already exists (e.g. a re-run).
        if: steps.changesets.outputs.published == 'true' || (steps.line.outputs.newest == 'false' && steps.line.outputs.pending == 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCT_TAG="v$(cat VERSION)"
          if git rev-parse -q --verify "refs/tags/${PRODUCT_TAG}" >/dev/null || \
             git ls-remote --exit-code --tags origin "${PRODUCT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${PRODUCT_TAG} already exists - skipping."
            exit 0
          fi
          git tag "${PRODUCT_TAG}"
          git push origin "${PRODUCT_TAG}"
          # The product version's MAJOR names the targeted Opencast major (the
          # JAR is major-bound via OSGi import ranges), but WHICH exact
          # Opencast the bundles were compiled against is a per-build fact —
          # stamp it into the release notes instead of the version number.
          OPENCAST_VERSION="$(sed -n 's|.*<opencast.version>\(.*\)</opencast.version>.*|\1|p' pom.xml | head -1)"
          PRODUCT_MAJOR="${PRODUCT_TAG#v}"; PRODUCT_MAJOR="${PRODUCT_MAJOR%%.*}"
          gh release create "${PRODUCT_TAG}" \
            --title "Management UI ${PRODUCT_TAG}" \
            --notes "Built against Opencast \`${OPENCAST_VERSION:-unknown}\` (runs on any Opencast ${PRODUCT_MAJOR} minor — the backend bundles are bound to the major, not a specific minor)." \
            --generate-notes \
            --verify-tag
