name: Release

# Versions and publishes the @oc-mui/* SDK packages via Changesets.
#
# Flow (see docs/operations/release.md -> "Cutting a release"):
#   - On each run the Changesets action checks for pending .changeset/*.md files.
#   - If any exist, it opens/updates a "Version Packages" PR that aggregates them
#     into version bumps + changelogs (runs `pnpm changeset:version`).
#   - When that PR is merged (no changesets left), the next run publishes: it
#     runs `pnpm changeset publish` -> npm publish per bumped package + git tags.
#
# ── NOT LIVE YET (the Phase 6d publish flip) ──────────────────────────────────
# Dispatch-only until the flip. Even if run now it publishes nothing: the SDK
# packages are `private: true` (Changesets skips private packages) and
# .changeset/config.json has `access: "restricted"`. To go live (release.md):
#   1. Drop `private: true` from the 15 SDK packages.
#   2. Flip .changeset/config.json "access" -> "public".
#   3. Add the NPM_TOKEN repo secret (an npm automation token with publish
#      rights to the @oc-mui scope).
#   4. Uncomment the `push:` trigger below and point it at your release branch
#      (keep it aligned with `baseBranch` in .changeset/config.json).

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

# Only one release run at a time (they race on tags and the Version PR).
concurrency: ${{ github.workflow }}

permissions:
  contents: write # commit version bumps + push git tags
  pull-requests: write # open/update the "Version Packages" PR

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # Never run from a fork.
    if: github.repository == 'academic-moodle-cooperation/management-tool'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Changesets needs full history to diff/tag

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Build the SDK (dist + dist-types)
        run: |
          # vite-config first (ordering guard - other packages import its dist),
          # then the full build so every SDK package ships dist/ + dist-types/
          # for publishConfig.exports.
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "vite-config dist files missing" && exit 1)
          pnpm turbo run build build:types

      - name: Configure npm auth
        # pnpm expands ${NPM_TOKEN} from the env at publish time, so the literal
        # token is never written to disk. The runner checkout is throwaway.
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" >> .npmrc

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
