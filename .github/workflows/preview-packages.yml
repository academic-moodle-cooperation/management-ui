name: Preview packages (pkg.pr.new)

# Publishes per-commit *preview* builds of the SDK packages to the pkg.pr.new
# CDN, so anyone (e.g. a backend / plugin author) can install the exact
# artifacts from a branch or PR before they're ever published to npm:
#
#   pnpm add https://pkg.pr.new/@oc-mui/ui@<commit-sha>
#
# On a PR, pkg.pr.new comments the ready-to-copy install URLs.
#
# ── ONE-TIME SETUP (maintainer, on github.com) ────────────────────────────────
# Install the pkg.pr.new GitHub App on the repo running this workflow:
#   https://github.com/apps/pkg-pr-new
# pkg.pr.new checks the App against $GITHUB_REPOSITORY (the repo the job runs
# on), so install it wherever you want previews. Until then the publish step is
# rejected — but it's `continue-on-error`, so it never fails the PR. No npm
# account or token is involved; pkg.pr.new is a preview CDN, not npm.
#
# Note: pkg.pr.new SKIPS `private: true` packages. The SDK is `private` pre-1.0,
# so a dedicated step strips `private` before publishing (the runner checkout is
# throwaway, so it is not restored).
#
# The packages are built first (they ship dist/ via publishConfig); the `--pnpm`
# flag makes pkg.pr.new pack with pnpm so publishConfig.exports is applied
# (consumers get the dist artifact, same as a real publish).

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, "r/**"]
    paths:
      - "packages/**"
      - "plugins/**"
      - ".github/workflows/preview-packages.yml"

jobs:
  preview:
    name: Publish preview packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SDK (dist + dist-types)
        run: |
          # vite-config first (ordering guard), then the full build.
          pnpm turbo run build --force --filter=@oc-mui/vite-config
          test -f packages/vite-config/dist/plugin.config.js || (echo "❌ vite-config dist files missing" && exit 1)
          pnpm turbo run build build:types

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Make the SDK packages publishable (strip private)
        # pkg.pr.new skips `private: true` packages; the SDK is private pre-1.0.
        # Strip it for this throwaway build (not restored — the runner checkout
        # is ephemeral). Keep this list in sync with the publish list below.
        run: >
          node -e 'for (const d of process.argv.slice(1)) { const fs = require("fs"), p = d + "/package.json"; const j = JSON.parse(fs.readFileSync(p, "utf8")); delete j.private; fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n"); }'
          packages/plugin-system
          plugins/core
          packages/app-runtime
          packages/ui
          packages/ui-config
          packages/utils
          packages/i18n
          packages/query
          packages/router
          packages/store
          packages/plugin-testing
          packages/vite-config
          packages/eslint-config
          packages/typescript-config
          packages/tailwind-config

      - name: Publish preview packages
        # Optional convenience job — never fail the PR if pkg.pr.new isn't set up
        # on this repo (App not installed, etc.). The PR comment (or its absence)
        # is the real signal.
        continue-on-error: true
        # Only the 15 publishable SDK packages — not the feature plugins or
        # host-only infra. Keep this list in sync with the SDK set documented in
        # docs/operations/release.md ("What gets published").
        run: >
          pnpm dlx pkg-pr-new@0.0.75 publish --pnpm
          ./packages/plugin-system
          ./plugins/core
          ./packages/app-runtime
          ./packages/ui
          ./packages/ui-config
          ./packages/utils
          ./packages/i18n
          ./packages/query
          ./packages/router
          ./packages/store
          ./packages/plugin-testing
          ./packages/vite-config
          ./packages/eslint-config
          ./packages/typescript-config
          ./packages/tailwind-config
