name: Deploy docs

# How this workflow is gated:
#
# - workflow_dispatch  — always available; deploy manually from the Actions tab.
# - pull_request       — builds the site on every PR that touches docs/ or
#                        package.json so reviewers know the build still passes.
#                        Does NOT deploy.
# - push to main       — currently disabled. Uncomment when you're ready
#                        for the published site to update on every merge to
#                        main.
#
# Pre-1.0 the site is also blocked from search indexing through two
# belt-and-suspenders guards: docs/public/robots.txt + a noindex meta tag in
# docs/.vitepress/config.mts. All three guards (this workflow, robots.txt,
# meta tag) flip together when going public — see
# docs/operations/open-followups.md §8.3 for the checklist.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; cancel in-progress builds when a newer
# commit lands so the live site never lags behind for long.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for VitePress lastUpdated to populate correctly.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Ensure .local-plugins exists
        run: mkdir -p .local-plugins

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        env:
          # Override the VitePress base path here when the deploy target's
          # URL prefix differs from the default (/management-ui/).
          DOCS_BASE: ${{ vars.DOCS_BASE || '/management-ui/' }}
        run: pnpm docs:build

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
