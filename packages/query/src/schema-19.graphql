type MuiEventInfo {
  isPublic: Boolean
  managedAclId: Long
  publishUrl: String
  thumbnailUrl: String
}

type MuiMutation {
  """Delete event"""
  deleteEvent(id: String!): DeleteEventPayload

  """Update event metadata"""
  updateEvent(id: String!, metadata: CommonEventMetadataInput!, acl: AccessControlListInput, publishChanges: Boolean = true): Event!

  """Update event acl"""
  updateEventAcl(id: String!, acl: AccessControlListInput!, publishChanges: Boolean = true): Event!

  """Update series metadata"""
  updateSeries(id: String!, metadata: CommonSeriesMetadataInput!, acl: AccessControlListInput): Boolean!
}

type MuiSeriesInfo {
  isPublic: Boolean
  managedAclId: Long
}

type Mutation {
  """Delete event"""
  deleteEvent(id: String!): DeleteEventPayload

  """Update event metadata"""
  updateEvent(id: String!, metadata: CommonEventMetadataInput!, acl: AccessControlListInput): Event!

  """Update event acl"""
  updateEventAcl(id: String!, acl: AccessControlListInput!): Event!
  mui: MuiMutation

  """Create series with metadata and acl"""
  createSeries(metadata: CommonSeriesMetadataInput!, acl: AccessControlListInput!): Series!

  """Update series metadata and optional the acl"""
  updateSeries(id: String!, metadata: CommonSeriesMetadataInput!, acl: AccessControlListInput): Series!

  """Update series acl"""
  updateSeriesAcl(id: String!, acl: AccessControlListInput!): Series!
}

