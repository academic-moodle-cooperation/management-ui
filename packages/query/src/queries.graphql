### ---------------------------------------------------------------------------------------------
## Queries
### ---------------------------------------------------------------------------------------------

# -----------------------------------------------------------------------------------------------
## User
# -----------------------------------------------------------------------------------------------
# Plugin stubs merged at runtime (convention: fragment Plugin<Type>Fields on <Type>).

# eslint-disable-next-line local/graphql-operation-naming
fragment PluginCurrentUserFields on CurrentUser {
  __typename
}

# eslint-disable-next-line local/graphql-operation-naming
fragment PluginUserFields on User {
  __typename
}

# eslint-disable-next-line local/graphql-operation-naming
query User {
  currentUser {
    email
    name
    username
    userRole
    ...PluginCurrentUserFields
  }
}

# eslint-disable-next-line local/graphql-operation-naming
query SearchUser($limit: Int, $offset: Int, $query: String!) {
  searchUser(limit: $limit, offset: $offset, query: $query) {
    totalCount
    nodes {
      email
      name
      provider
      roles
      userRole
      username
      ...PluginUserFields
    }
    pageInfo {
      limit
      offset
      pageCount
    }
  }
}

# -----------------------------------------------------------------------------------------------
## Series
# -----------------------------------------------------------------------------------------------
# PluginSeriesFields: stub merged at runtime (same convention as PluginEventFields).

# eslint-disable-next-line local/graphql-operation-naming
fragment PluginSeriesFields on Series {
  __typename
}

# eslint-disable-next-line local/graphql-operation-naming
fragment SeriesData on Series {
  __typename
  id
  contributors
  created
  creator
  description
  title
  events {
    nodes {
      id
      title
      eventStatus
    }
    totalCount
  }
  muiSeriesInfo {
    isPublic
    managedAclId
  }
  ...PluginSeriesFields
}

# eslint-disable-next-line local/graphql-operation-naming
query GetMySeries($limit: Int, $offset: Int, $orderBy: SeriesOrderByInput, $query: String) {
  currentUser {
    mySeries(limit: $limit, offset: $offset, orderBy: $orderBy, query: $query) {
      totalCount
      nodes {
        ...SeriesData
      }
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
query GetSeriesInfo($seriesId: String!) {
  seriesById(id: $seriesId) {
    contributors
    created
    creator
    description
    events {
      nodes {
        id
      }
      totalCount
    }
    id
    license
    organizers
    publishers
    rightsHolder
    title
  }
}

# eslint-disable-next-line local/graphql-operation-naming
fragment GetInputFieldsMetaData on JsonMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

# eslint-disable-next-line local/graphql-operation-naming
fragment GetListInputFieldsMetaData on ListMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

# eslint-disable-next-line local/graphql-operation-naming
fragment GetStringInputFieldsMetaData on StringMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

# eslint-disable-next-line local/graphql-operation-naming
fragment GetDurationInputFieldsMetaData on DurationMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

# eslint-disable-next-line local/graphql-operation-naming
fragment GetDateTimeInputFieldsMetaData on DateTimeMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

# eslint-disable-next-line local/graphql-operation-naming
query GetSeriesByIdInputFields($seriesId: String!) {
  seriesById(id: $seriesId) {
    commonMetadataV2 {
      contributor {
        ...GetListInputFieldsMetaData
      }
      title {
        ...GetStringInputFieldsMetaData
      }
      subject {
        ...GetStringInputFieldsMetaData
      }
      rightsHolder {
        ...GetStringInputFieldsMetaData
      }
      publisher {
        ...GetListInputFieldsMetaData
      }
      license {
        ...GetStringInputFieldsMetaData
      }
      language {
        ...GetStringInputFieldsMetaData
      }
      identifier {
        ...GetStringInputFieldsMetaData
      }
      description {
        ...GetStringInputFieldsMetaData
      }
      creator {
        ...GetListInputFieldsMetaData
      }
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
query GetMySeriesNameAndId(
  $limit: Int
  $offset: Int
  $orderBy: SeriesOrderByInput
  $query: String
) {
  currentUser {
    mySeries(limit: $limit, offset: $offset, orderBy: $orderBy, query: $query) {
      nodes {
        id
        title
      }
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
query GetSeriesNameById($seriesId: String!) {
  seriesById(id: $seriesId) {
    title
  }
}

# -----------------------------------------------------------------------------------------------
## Events
# -----------------------------------------------------------------------------------------------
# PluginEventFields: stub merged at runtime (convention: fragment Plugin<Type>Fields on <Type>).

# eslint-disable-next-line local/graphql-operation-naming
fragment PluginEventFields on Event {
  __typename
}

# eslint-disable-next-line local/graphql-operation-naming
fragment EventsData on Event {
  __typename
  contributors
  seriesName
  seriesId
  title
  creator
  created
  description
  displayableStatus
  eventStatus
  duration
  hasPreview
  id
  location
  presenters
  startDate
  publications(channel: "engage-player") {
    uri
    tracks(tags: "engage-download") {
      width
      uri
      tags
      mimeType
      logicalName
      isLive
      height
      frameRate
      flavor
    }
  }
  hasPreview
  muiEventInfo {
    isPublic
    managedAclId
    publishUrl
    thumbnailUrl
  }
  ...PluginEventFields
}

# eslint-disable-next-line local/graphql-operation-naming
query EventsFromSeries(
  $seriesId: String!
  $limit: Int
  $offset: Int
  $orderBy: EventOrderByInput
  $query: String
) {
  seriesById(id: $seriesId) {
    id
    title
    events(limit: $limit, offset: $offset, orderBy: $orderBy, query: $query) {
      totalCount
      nodes {
        ...EventsData
      }
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
query GetMyEvents($limit: Int, $offset: Int, $orderBy: EventOrderByInput, $query: String) {
  currentUser {
    myEvents(limit: $limit, offset: $offset, orderBy: $orderBy, query: $query) {
      totalCount
      nodes {
        ...EventsData
      }
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
query GetEventById($eventId: String!) {
  eventById(id: $eventId) {
    id
    title
  }
}

# eslint-disable-next-line local/graphql-operation-naming
query GetEventByIdInputFields($eventId: String!) {
  eventById(id: $eventId) {
    commonMetadataV2 {
      contributor {
        ...GetListInputFieldsMetaData
      }
      created {
        ...GetDateTimeInputFieldsMetaData
      }
      creator {
        ...GetListInputFieldsMetaData
      }
      description {
        ...GetStringInputFieldsMetaData
      }
      duration {
        ...GetDurationInputFieldsMetaData
      }
      identifier {
        ...GetStringInputFieldsMetaData
      }
      isPartOf {
        ...GetStringInputFieldsMetaData
      }
      language {
        ...GetStringInputFieldsMetaData
      }
      license {
        ...GetStringInputFieldsMetaData
      }
      location {
        ...GetStringInputFieldsMetaData
      }
      publisher {
        ...GetStringInputFieldsMetaData
      }
      rightsHolder {
        ...GetStringInputFieldsMetaData
      }
      source {
        ...GetStringInputFieldsMetaData
      }
      startDate {
        ...GetDateTimeInputFieldsMetaData
      }
      subject {
        ...GetStringInputFieldsMetaData
      }
      title {
        ...GetStringInputFieldsMetaData
      }
    }
  }
}

# -----------------------------------------------------------------------------------------------
## ACLs
# -----------------------------------------------------------------------------------------------

# eslint-disable-next-line local/graphql-operation-naming
query GetAllManagedAcls {
  managedAcls {
    nodes {
      name
      id
      acl {
        entries {
          role
          action
        }
      }
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
query GetManagedAclsWithEventId($id: String!) {
  managedAcls {
    nodes {
      name
      id
      acl {
        entries {
          role
          action
        }
      }
    }
  }
  ...EventsAclData
}

# eslint-disable-next-line local/graphql-operation-naming
query GetManagedAclsWithSeriesId($id: String!) {
  managedAcls {
    nodes {
      name
      id
      acl {
        entries {
          role
          action
        }
      }
    }
  }
  ...SeriesAclData
}

# eslint-disable-next-line local/graphql-operation-naming
fragment EventsAclData on Query {
  eventById(id: $id) {
    acl {
      users {
        role
        label
        action
      }
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
fragment SeriesAclData on Query {
  seriesById(id: $id) {
    acl {
      users {
        role
        label
        action
      }
    }
  }
}

### ---------------------------------------------------------------------------------------------
## MUTATIONS
### ---------------------------------------------------------------------------------------------

# eslint-disable-next-line local/graphql-operation-naming
mutation CreateSeries($acl: AccessControlListInput!, $metadata: CommonSeriesMetadataInput!) {
  createSeries(acl: $acl, metadata: $metadata) {
    ...SeriesData
  }
}

# eslint-disable-next-line local/graphql-operation-naming
mutation UpdateSeries($seriesId: String!, $metadata: CommonSeriesMetadataInput!) {
  updateSeries(id: $seriesId, metadata: $metadata) {
    ...SeriesData
  }
}

# eslint-disable-next-line local/graphql-operation-naming
mutation UpdateEvent($eventId: String!, $metadata: CommonEventMetadataInput!) {
  mui {
    updateEvent(id: $eventId, metadata: $metadata) {
      ...EventsData
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
mutation DeleteEvent($eventId: String!) {
  mui {
    deleteEvent(id: $eventId) {
      id
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
mutation UpdateEventAcl($eventId: String!, $acl: AccessControlListInput!) {
  mui {
    updateEventAcl(id: $eventId, acl: $acl) {
      muiEventInfo {
        managedAclId
      }
    }
  }
}

# eslint-disable-next-line local/graphql-operation-naming
mutation UpdateSeriesAcl($seriesId: String!, $acl: AccessControlListInput!) {
  updateSeriesAcl(id: $seriesId, acl: $acl) {
    muiSeriesInfo {
      managedAclId
    }
  }
}

