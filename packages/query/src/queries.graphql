### ---------------------------------------------------------------------------------------------
## Queries
### ---------------------------------------------------------------------------------------------

# -----------------------------------------------------------------------------------------------
## User
# -----------------------------------------------------------------------------------------------
# Plugin stubs merged at runtime (convention: fragment Plugin<Type>Fields on <Type>).

fragment MuiCurrentUserFields on CurrentUser {
  __typename
}

fragment MuiUserFields on User {
  __typename
}

query MuiUser {
  currentUser {
    email
    name
    username
    userRole
    ...MuiCurrentUserFields
  }
}

query MuiSearchUser($limit: Int, $offset: Int, $query: String!) {
  searchUser(limit: $limit, offset: $offset, query: $query) {
    totalCount
    nodes {
      email
      name
      provider
      roles
      userRole
      username
      ...MuiUserFields
    }
    pageInfo {
      limit
      offset
      pageCount
    }
  }
}

# -----------------------------------------------------------------------------------------------
## Series
# -----------------------------------------------------------------------------------------------
# PluginSeriesFields: stub merged at runtime (same convention as PluginEventFields).

fragment MuiSeriesFields on Series {
  __typename
}

fragment MuiSeriesData on Series {
  __typename
  id
  contributors
  created
  creator
  description
  title
  events {
    nodes {
      id
      title
      eventStatus
    }
    totalCount
  }
  muiSeriesInfo {
    isPublic
    managedAclId
  }
  ...MuiSeriesFields
}

query MuiGetMySeries($limit: Int, $offset: Int, $orderBy: SeriesOrderByInput, $query: String) {
  currentUser {
    mySeries(limit: $limit, offset: $offset, orderBy: $orderBy, query: $query) {
      totalCount
      nodes {
        ...MuiSeriesData
      }
    }
  }
}

query MuiGetSeriesInfo($seriesId: String!) {
  seriesById(id: $seriesId) {
    contributors
    created
    creator
    description
    events {
      nodes {
        id
      }
      totalCount
    }
    id
    license
    organizers
    publishers
    rightsHolder
    title
  }
}

fragment MuiGetInputFieldsMetaData on JsonMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

fragment MuiGetListInputFieldsMetaData on ListMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

fragment MuiGetStringInputFieldsMetaData on StringMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

fragment MuiGetDurationInputFieldsMetaData on DurationMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

fragment MuiGetDateTimeInputFieldsMetaData on DateTimeMetadataField {
  collectionId
  collection
  id
  label
  listProvider
  order
  readOnly
  required
  type
  value
}

query MuiGetSeriesByIdInputFields($seriesId: String!) {
  seriesById(id: $seriesId) {
    commonMetadataV2 {
      contributor {
        ...MuiGetListInputFieldsMetaData
      }
      title {
        ...MuiGetStringInputFieldsMetaData
      }
      subject {
        ...MuiGetStringInputFieldsMetaData
      }
      rightsHolder {
        ...MuiGetStringInputFieldsMetaData
      }
      publisher {
        ...MuiGetListInputFieldsMetaData
      }
      license {
        ...MuiGetStringInputFieldsMetaData
      }
      language {
        ...MuiGetStringInputFieldsMetaData
      }
      identifier {
        ...MuiGetStringInputFieldsMetaData
      }
      description {
        ...MuiGetStringInputFieldsMetaData
      }
      creator {
        ...MuiGetListInputFieldsMetaData
      }
    }
  }
}

query MuiGetMySeriesNameAndId(
  $limit: Int
  $offset: Int
  $orderBy: SeriesOrderByInput
  $query: String
) {
  currentUser {
    mySeries(limit: $limit, offset: $offset, orderBy: $orderBy, query: $query) {
      nodes {
        id
        title
      }
    }
  }
}

query MuiGetSeriesNameById($seriesId: String!) {
  seriesById(id: $seriesId) {
    title
  }
}

# -----------------------------------------------------------------------------------------------
## Events
# -----------------------------------------------------------------------------------------------
# PluginEventFields: stub merged at runtime (convention: fragment Plugin<Type>Fields on <Type>).

fragment MuiEventFields on Event {
  __typename
}

fragment MuiEventsData on Event {
  __typename
  contributors
  seriesName
  seriesId
  title
  creator
  created
  description
  displayableStatus
  eventStatus
  duration
  hasPreview
  id
  location
  presenters
  startDate
  publications(channel: $channel) {
    uri
    tracks(tags: $tags) {
      width
      uri
      tags
      mimeType
      logicalName
      isLive
      height
      frameRate
      flavor
    }
  }
  hasPreview
  muiEventInfo {
    isPublic
    managedAclId
    publishUrl
    thumbnailUrl
  }
  ...MuiEventFields
}

query MuiEventsFromSeries(
  $seriesId: String!
  $limit: Int
  $offset: Int
  $orderBy: EventOrderByInput
  $query: String
  $channel: String
  $tags: [String]
) {
  seriesById(id: $seriesId) {
    id
    title
    events(limit: $limit, offset: $offset, orderBy: $orderBy, query: $query) {
      totalCount
      nodes {
        ...MuiEventsData
      }
    }
  }
}

query MuiGetMyEvents($limit: Int, $offset: Int, $orderBy: EventOrderByInput, $query: String, $channel: String, $tags: [String]) {
  currentUser {
    myEvents(limit: $limit, offset: $offset, orderBy: $orderBy, query: $query) {
      totalCount
      nodes {
        ...MuiEventsData
      }
    }
  }
}

query MuiGetEventById($eventId: String!) {
  eventById(id: $eventId) {
    id
    title
  }
}

query MuiGetEventByIdInputFields($eventId: String!) {
  eventById(id: $eventId) {
    commonMetadataV2 {
      contributor {
        ...MuiGetListInputFieldsMetaData
      }
      created {
        ...MuiGetDateTimeInputFieldsMetaData
      }
      creator {
        ...MuiGetListInputFieldsMetaData
      }
      description {
        ...MuiGetStringInputFieldsMetaData
      }
      duration {
        ...MuiGetDurationInputFieldsMetaData
      }
      identifier {
        ...MuiGetStringInputFieldsMetaData
      }
      isPartOf {
        ...MuiGetStringInputFieldsMetaData
      }
      language {
        ...MuiGetStringInputFieldsMetaData
      }
      license {
        ...MuiGetStringInputFieldsMetaData
      }
      location {
        ...MuiGetStringInputFieldsMetaData
      }
      publisher {
        ...MuiGetStringInputFieldsMetaData
      }
      rightsHolder {
        ...MuiGetStringInputFieldsMetaData
      }
      source {
        ...MuiGetStringInputFieldsMetaData
      }
      startDate {
        ...MuiGetDateTimeInputFieldsMetaData
      }
