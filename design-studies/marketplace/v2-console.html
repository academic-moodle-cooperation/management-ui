<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugin Directory — Console Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #21201E;
    --bg-sunken: #1B1A18;
    --panel: #292826;
    --panel-hover: #2F2E2B;
    --line: #383632;
    --line-strong: #45423D;
    --text: #EDEAE4;
    --text-soft: #A8A398;
    --text-faint: #7A756B;
    --accent: #D97757;
    --green: #7FB069;
    --green-dim: rgba(127,176,105,.14);
    --blue: #6C9BD1;
    --font: "Instrument Sans", "Helvetica Neue", sans-serif;
    --mono: "Spline Sans Mono", ui-monospace, monospace;
    --r: 14px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font); background: var(--bg-sunken); color: var(--text);
    -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex;
  }
  ::selection { background: rgba(217,119,87,.35); }

  /* ---------------- sidebar ---------------- */
  aside {
    width: 232px; flex-shrink: 0; padding: 20px 12px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand {
    display:flex; align-items:center; gap:10px; padding: 6px 10px 18px;
    font-weight: 650; font-size: 15px; letter-spacing: -0.01em;
  }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #A64B2E);
    display:flex; align-items:center; justify-content:center;
  }
  .brand .mark svg { display:block; }
  .side-label {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-faint); padding: 14px 10px 6px;
  }
  .side-item {
    display:flex; align-items:center; gap:10px; padding: 7px 10px;
    border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--text-soft);
    cursor: pointer; border: none; background: none; font-family: var(--font);
    width: 100%; text-align: left; transition: background .12s, color .12s;
  }
  .side-item:hover { background: var(--panel); color: var(--text); }
  .side-item.active { background: var(--panel-hover); color: var(--text); }
  .side-item svg { flex-shrink:0; opacity:.75; }
  .side-item .n {
    margin-left:auto; font-family: var(--mono); font-size: 11px;
    color: var(--text-faint);
  }
  .side-item .dot-badge {
    margin-left:auto; width:7px; height:7px; border-radius:50%; background: var(--accent);
  }
  .side-foot {
    margin-top:auto; padding: 14px; border: 1px solid var(--line); border-radius: 12px;
    background: linear-gradient(180deg, var(--panel), transparent);
  }
  .side-foot .t { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .side-foot .d { font-size: 12px; color: var(--text-soft); line-height: 1.45; margin-bottom: 10px; }
  .side-foot a {
    font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none;
  }

  /* ---------------- main ---------------- */
  main { flex: 1; min-width: 0; }
  .topbar {
    display:flex; align-items:center; gap: 8px; height: 58px;
    padding: 0 28px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: color-mix(in srgb, var(--bg-sunken) 88%, transparent);
    backdrop-filter: blur(10px); z-index: 30;
    font-size: 13.5px; color: var(--text-faint);
  }
  .topbar .crumb { color: var(--text-faint); }
  .topbar .crumb.here { color: var(--text); font-weight: 600; }
  .topbar .sep { opacity:.5; }
  .content { padding: 24px 28px 80px; max-width: 1060px; }

  .toolbar { display:flex; gap: 10px; margin-bottom: 22px; }
  .search {
    flex:1; position: relative;
  }
  .search svg { position:absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity:.5; }
  .search input {
    width: 100%; height: 44px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); font-family: var(--font); font-size: 14px;
    padding: 0 16px 0 40px; outline: none; transition: border-color .15s;
  }
  .search input::placeholder { color: var(--text-faint); }
  .search input:focus { border-color: var(--line-strong); }
  .filter-btn {
    height: 44px; padding: 0 18px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--text-soft); font-family: var(--font); font-size: 13.5px; font-weight: 500;
    cursor: pointer; display:flex; align-items:center; gap:8px; transition: all .15s;
  }
  .filter-btn:hover, .filter-btn.active { color: var(--text); border-color: var(--line-strong); }
  .filter-btn.active { background: var(--panel-hover); }

  .cat-row { display:flex; gap: 7px; flex-wrap: wrap; margin: -6px 0 22px; }
  .cat {
    font-size: 12.5px; font-weight: 500; color: var(--text-soft);
    background: none; border: 1px solid var(--line); border-radius: 99px;
    padding: 5px 13px; cursor: pointer; font-family: var(--font); transition: all .13s;
  }
  .cat:hover { color: var(--text); border-color: var(--line-strong); }
  .cat.active { background: var(--text); color: var(--bg-sunken); border-color: var(--text); font-weight: 600; }

  /* ---------------- grid + cards ---------------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    padding: 18px; display: flex; gap: 14px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .18s;
    animation: fade .4s ease both;
  }
  @keyframes fade { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none;} }
  .card:hover { border-color: var(--line-strong); background: var(--panel-hover); }
  .tile {
    width: 52px; height: 52px; border-radius: 13px; flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 4px 12px -4px rgba(0,0,0,.5);
  }
  .tile svg { display:block; }
  .card-main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .card-line1 { display:flex; align-items:center; gap:7px; margin-bottom: 3px; }
  .card-name { font-size: 14.5px; font-weight: 650; letter-spacing: -0.005em; }
  .vcheck { width:14px; height:14px; color: var(--text-faint); flex-shrink:0; }
  .pill {
    font-size: 10.5px; font-weight: 650; letter-spacing:.02em;
    padding: 2.5px 8px; border-radius: 6px;
  }
  .pill-new { color: #8FB4E3; background: rgba(108,155,209,.16); }
  .pill-trend { color: #E3A88F; background: rgba(217,119,87,.16); }
  .card-desc { font-size: 13px; line-height: 1.45; color: var(--text-soft); }
  .card-meta { margin-top: 8px; font-size: 11.5px; color: var(--text-faint); display:flex; gap: 12px; font-family: var(--mono); }
  .card-action { align-self: center; flex-shrink: 0; }
  .act-btn {
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line-strong); background: transparent; color: var(--text-soft);
    display:flex; align-items:center; justify-content:center; transition: all .15s;
  }
  .act-btn:hover { border-color: var(--text-soft); color: var(--text); transform: scale(1.06); }
  .act-btn.installed {
    border-color: transparent; background: var(--green-dim); color: var(--green); cursor: default;
  }
  .act-btn.installed:hover { transform: none; }

  .section-h {
    display:flex; align-items:baseline; gap:10px; margin: 30px 0 14px;
  }
  .section-h:first-of-type { margin-top: 0; }
  .section-h .t { font-size: 15px; font-weight: 650; letter-spacing: -0.005em; }
  .section-h .c { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }

  .empty { padding: 70px 0; text-align: center; color: var(--text-faint); font-size: 14px; }
  .empty b { display:block; color: var(--text-soft); font-size: 16px; margin-bottom: 6px; }

  /* ---------------- library rows ---------------- */
  .lib-list { display:flex; flex-direction:column; gap:10px; }
  .lib-row {
    display:flex; align-items:center; gap: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    padding: 14px 18px; animation: fade .4s ease both;
  }
  .lib-row .tile { width: 42px; height: 42px; border-radius: 11px; }
  .lib-main { flex:1; min-width:0; cursor:pointer; }
  .lib-name { font-size: 14px; font-weight: 650; display:flex; align-items:center; gap:8px; }
  .lib-sub { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; }
  .lib-v { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
  .up-pill {
    font-size: 10.5px; font-weight: 650; color: #E3A88F; background: rgba(217,119,87,.16);
    padding: 2.5px 8px; border-radius: 6px;
  }
  .txt-btn {
    font-family: var(--font); font-size: 12.5px; font-weight: 600;
    border-radius: 9px; padding: 7px 14px; cursor:pointer; border: 1px solid var(--line-strong);
    background: transparent; color: var(--text-soft); transition: all .14s;
  }
  .txt-btn:hover { color: var(--text); border-color: var(--text-faint); }
  .txt-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .txt-btn.primary:hover { background: #C4663F; }
  .switch {
    width: 38px; height: 22px; border-radius: 99px; border:none; cursor:pointer;
    background: var(--line-strong); position: relative; transition: background .16s; flex-shrink:0;
  }
  .switch::after {
    content:""; position:absolute; top:2.5px; left:3px; width:17px; height:17px; border-radius:50%;
    background:#fff; transition: transform .16s;
  }
  .switch.on { background: var(--green); }
  .switch.on::after { transform: translateX(15px); }

  /* ---------------- detail modal ---------------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60; display:none;
    align-items: flex-start; justify-content: center;
    background: rgba(10,9,8,.6); backdrop-filter: blur(5px);
    padding: 7vh 24px; overflow-y: auto;
  }
  .overlay.open { display:flex; animation: ovIn .18s ease both; }
  @keyframes ovIn { from {opacity:0;} to {opacity:1;} }
  .sheet {
    width: 100%; max-width: 640px; background: var(--bg);
    border: 1px solid var(--line-strong); border-radius: 18px;
    animation: shIn .28s cubic-bezier(.22,.8,.34,1) both;
  }
  @keyframes shIn { from {opacity:0; transform: translateY(18px) scale(.99);} to {opacity:1; transform:none;} }
  .sheet-pad { padding: 28px 30px 30px; }
  .sheet-head { display:flex; gap:16px; align-items:flex-start; }
  .sheet-head .tile { width: 64px; height: 64px; border-radius: 16px; }
  .sheet-titles { flex:1; min-width:0; padding-top: 4px; }
  .sheet-titles h3 { font-size: 19px; font-weight: 700; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px; }
  .sheet-titles .by { font-size: 13px; color: var(--text-faint); margin-top: 3px; }
  .sheet-x {
    background:none; border:none; color: var(--text-faint); cursor:pointer;
    width: 30px; height:30px; border-radius:8px; font-size: 15px; transition: all .13s;
  }
  .sheet-x:hover { background: var(--panel); color: var(--text); }
  .meta-grid {
    display:grid; grid-template-columns: repeat(4,1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 12px;
    overflow:hidden; margin: 22px 0 18px;
  }
  .meta-grid > div { background: var(--panel); padding: 12px 14px; }
  .meta-grid .k { font-size: 10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color: var(--text-faint); }
  .meta-grid .v { font-size: 13.5px; font-weight: 600; margin-top: 4px; }
  .sheet-desc { font-size: 13.5px; line-height: 1.6; color: var(--text-soft); }
  .sheet-desc p + p { margin-top: 9px; }
  .sub-h { font-size: 11px; font-weight: 650; letter-spacing:.08em; text-transform:uppercase; color: var(--text-faint); margin: 20px 0 9px; }
  .ext { display:flex; flex-wrap:wrap; gap:7px; }
  .ext code {
    font-family: var(--mono); font-size: 11.5px; color: var(--text-soft);
    background: var(--panel); border:1px solid var(--line); border-radius: 7px; padding: 4px 9px;
  }
  .sheet-cta-row { display:flex; gap:10px; margin-top: 24px; }
  .sheet-cta-row .grow { flex:1; }

  /* toast */
  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(70px);
    background: var(--panel-hover); border: 1px solid var(--line-strong); color: var(--text);
    font-size: 13px; font-weight: 500; padding: 11px 20px; border-radius: 12px;
    z-index: 80; opacity: 0; transition: all .28s cubic-bezier(.22,.8,.34,1);
    display:flex; align-items:center; gap:9px; box-shadow: 0 14px 40px -10px rgba(0,0,0,.6);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity:1; }
  .toast .dot { width:7px; height:7px; border-radius:50%; background: var(--green); }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <span class="mark"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg></span>
    Plugins
  </div>
  <div class="side-label">Directory</div>
  <button class="side-item active" id="nav-all" onclick="setView('all')">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    All plugins
  </button>
  <button class="side-item" id="nav-themes" onclick="setView('themes')">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18"/></svg>
    Themes
  </button>
  <div class="side-label">Library</div>
  <button class="side-item" id="nav-installed" onclick="setView('installed')">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 13l5 5L20 6"/></svg>
    Installed <span class="n" id="n-installed"></span>
  </button>
  <button class="side-item" id="nav-updates" onclick="setView('updates')">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
    Updates <span class="dot-badge" id="upd-dot"></span>
  </button>
  <div class="side-foot">
    <div class="t">Build your own</div>
    <div class="d">Scaffold a plugin in one command and ship it to any deployment.</div>
    <a href="#" onclick="toast('The SDK docs would open here');return false">Read the SDK docs →</a>
  </div>
</aside>

<main>
  <div class="topbar" id="crumbs">
    <span class="crumb">Plugins</span><span class="sep">/</span>
    <span class="crumb">Directory</span><span class="sep">/</span>
    <span class="crumb here" id="crumb-here">All plugins</span>
  </div>
  <div class="content">
    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="Search plugins" oninput="state.q=this.value;render()">
      </div>
      <button class="filter-btn" id="verified-btn" onclick="state.verifiedOnly=!state.verifiedOnly;render()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.8l2.4 2.1 3.2-.3 1 3 2.9 1.4-.7 3.1 2 2.5-2 2.5.7 3.1-2.9 1.4-1 3-3.2-.3-2.4 2.1-2.4-2.1-3.2.3-1-3-2.9-1.4.7-3.1-2-2.5 2-2.5-.7-3.1 2.9-1.4 1-3 3.2.3z" opacity=".3"/><path d="M10.6 15.9l-3-3 1.3-1.3 1.7 1.7 4.5-4.5 1.3 1.3z"/></svg>
        Verified only
      </button>
    </div>
    <div class="cat-row" id="cats"></div>
    <div id="body"></div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toastEl"><span class="dot"></span><span id="toastTxt"></span></div>

<script>
/* ---------------- shared icon set (white strokes on gradient tiles) ------- */
const ICONS = {
  polls:   `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>`,
  captions:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 13h4M13 13h4M7 16h7"/></svg>`,
  chart:   `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8"/><path d="M15 6h3v3" opacity=".8"/></svg>`,
  quiz:    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M9 9a3 3 0 1 1 4.5 2.6c-.9.5-1.5 1-1.5 2.1"/><circle cx="12" cy="17.5" r="0.5" fill="#fff"/></svg>`,

  speech:  `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M20 20l-4.5-4.5"/><path d="M8 10c.7-1 1.3-1 2 0s1.3 1 2 0" stroke-width="1.8"/></svg>`,

  pen:     `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/></svg>`,
  hook:    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L6 13h5l-1 9 8-12h-5l1-8z" fill="#fff" stroke="none" opacity=".9"/></svg>`,
  themeA:  `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.4-2-.8-1.4.2-3 1.9-3H17a4 4 0 0 0 4-4c0-5-4-9-9-9z"/><circle cx="8" cy="10" r="1" fill="#fff"/><circle cx="12" cy="7" r="1" fill="#fff"/><circle cx="16" cy="10" r="1" fill="#fff"/></svg>`,
};

const GRADS = {
  orange: ["#F0865B","#C24E1F"], blue: ["#5B9CF0","#2760C2"], green: ["#67B26F","#2E7D44"],
  purple: ["#9A79E8","#5F3BB8"], teal: ["#4FB8C4","#1F7E8C"], rose: ["#E86F8E","#B83355"],
  amber: ["#E8B23C","#B87B14"], slate: ["#8B98AC","#54627A"], indigo:["#7C89E8","#3F4EB8"],
  mossy: ["#9BB25B","#5F7A2A"], coal: ["#6A675F","#3B3934"], sky:["#58C0E8","#2286B0"],
};

const PLUGINS = [

const CATS = ["All","Engagement","Accessibility","Analytics","Workflow","Integrations"];

const state = {
  view: "all", q: "", cat: "All", verifiedOnly: false,
  installed: new Set(["auto-captions","batch-uploader","theme-midnight"]),
  disabled: new Set(),
  updates: new Set(["auto-captions"]),
};

const $ = id => document.getElementById(id);
const byId = id => PLUGINS.find(p => p.id === id);
const grad = k => `background: linear-gradient(135deg, ${GRADS[k][0]}, ${GRADS[k][1]});`;

function toast(msg){ $("toastTxt").textContent=msg; $("toastEl").classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>$("toastEl").classList.remove("show"),2500); }

function vcheck(){ return `<svg class="vcheck" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.8l2.4 2.1 3.2-.3 1 3 2.9 1.4-.7 3.1 2 2.5-2 2.5.7 3.1-2.9 1.4-1 3-3.2-.3-2.4 2.1-2.4-2.1-3.2.3-1-3-2.9-1.4.7-3.1-2-2.5 2-2.5-.7-3.1 2.9-1.4 1-3 3.2.3z" opacity=".3"/><path d="M10.6 15.9l-3-3 1.3-1.3 1.7 1.7 4.5-4.5 1.3 1.3z"/></svg>`; }

function install(id, ev){ if(ev)ev.stopPropagation();
  if(state.installed.has(id))return;
  state.installed.add(id); toast(`${byId(id).name} installed`); render(); }
function uninstall(id, ev){ if(ev)ev.stopPropagation();
  state.installed.delete(id); state.updates.delete(id); state.disabled.delete(id);
  toast(`${byId(id).name} uninstalled`); render(); }
function applyUpdate(id, ev){ if(ev)ev.stopPropagation();
  state.updates.delete(id); toast(`${byId(id).name} updated`); render(); }
function toggleEnabled(id, ev){ if(ev)ev.stopPropagation();
  state.disabled.has(id)?state.disabled.delete(id):state.disabled.add(id); render(); }

function actionBtn(p){
  if(state.installed.has(p.id))
    return `<button class="act-btn installed" title="Installed" onclick="event.stopPropagation()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 13l5 5L20 6"/></svg></button>`;
  return `<button class="act-btn" title="Install" onclick="install('${p.id}', event)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>`;
}

function cardHtml(p, i){
  return `<article class="card" style="animation-delay:${i*0.03}s" onclick="openSheet('${p.id}')">
    <div class="tile" style="${grad(p.grad)}">${ICONS[p.icon]}</div>
    <div class="card-main">
      <div class="card-line1">
        <span class="card-name">${p.name}</span>${p.verified?vcheck():""}
        ${p.isNew?'<span class="pill pill-new">New</span>':""}${p.trending?'<span class="pill pill-trend">Trending</span>':""}
      </div>
      <div class="card-desc">${p.tagline}</div>
      <div class="card-meta"><span>${p.author}</span><span>↓ ${p.installs}</span></div>
    </div>
    <div class="card-action">${actionBtn(p)}</div>
  </article>`;
}

function matches(p){
  const q = state.q.trim().toLowerCase();
  return (!q || (p.name+" "+p.tagline+" "+p.author+" "+p.cat).toLowerCase().includes(q))
    && (!state.verifiedOnly || p.verified)
    && (state.cat==="All" || p.cat===state.cat);
}

function render(){
  $("n-installed").textContent = state.installed.size;
  $("upd-dot").style.display = state.updates.size ? "" : "none";
  $("verified-btn").classList.toggle("active", state.verifiedOnly);
  document.querySelectorAll("aside .side-item").forEach(b=>b.classList.remove("active"));
  $("nav-"+(state.view==="all"?"all":state.view==="themes"?"themes":state.view==="updates"?"updates":"installed")).classList.add("active");
  $("crumb-here").textContent = {all:"All plugins",themes:"Themes",installed:"Installed",updates:"Updates"}[state.view];

  const showCats = state.view==="all";
  $("cats").style.display = showCats?"":"none";
  if(showCats) $("cats").innerHTML = CATS.map(c=>
    `<button class="cat ${state.cat===c?"active":""}" onclick="state.cat='${c}';render()">${c}</button>`).join("");

  const body = $("body");
  if(state.view==="all"){
    const pool = PLUGINS.filter(p=>!p.isTheme).filter(matches);
    const feat = pool.filter(p=>p.trending||p.isNew);
    const rest = pool.filter(p=>!feat.includes(p));
    let html = "";
    if(!state.q.trim() && state.cat==="All" && !state.verifiedOnly){
      html += `<div class="section-h"><span class="t">Featured</span><span class="c">${feat.length}</span></div>
               <div class="grid">${feat.map(cardHtml).join("")}</div>
               <div class="section-h"><span class="t">Everything else</span><span class="c">${rest.length}</span></div>
               <div class="grid">${rest.map(cardHtml).join("")}</div>`;
    } else {
      html += pool.length
        ? `<div class="section-h"><span class="t">Results</span><span class="c">${pool.length}</span></div><div class="grid">${pool.map(cardHtml).join("")}</div>`
        : `<div class="empty"><b>No plugins match.</b>Try a different search — or build it with the SDK.</div>`;
    }
    body.innerHTML = html;
  } else if(state.view==="themes"){
    const pool = PLUGINS.filter(p=>p.isTheme).filter(matches);
    body.innerHTML = `<div class="section-h"><span class="t">Themes</span><span class="c">${pool.length}</span></div>
      <div class="grid">${pool.map(cardHtml).join("")}</div>`;
  } else if(state.view==="installed"){
    const ids=[...state.installed];
    body.innerHTML = ids.length ? `<div class="lib-list">${ids.map((id,i)=>{
      const p=byId(id), off=state.disabled.has(id), upd=state.updates.has(id);
      return `<div class="lib-row" style="animation-delay:${i*0.04}s;${off?"opacity:.55":""}">
        <div class="tile" style="${grad(p.grad)}">${ICONS[p.icon]}</div>
        <div class="lib-main" onclick="openSheet('${id}')">
          <div class="lib-name">${p.name}${p.verified?vcheck():""} ${upd?'<span class="up-pill">Update available</span>':""}</div>
          <div class="lib-sub">${p.tagline}</div>
        </div>
        <span class="lib-v">v${p.version}</span>
        ${upd?`<button class="txt-btn primary" onclick="applyUpdate('${id}', event)">Update</button>`:""}
        <button class="switch ${off?"":"on"}" onclick="toggleEnabled('${id}', event)" title="${off?"Enable":"Disable"}"></button>
        <button class="txt-btn" onclick="uninstall('${id}', event)">Remove</button>
      </div>`;}).join("")}</div>`
    : `<div class="empty"><b>Nothing installed yet.</b>Browse the directory and add something useful.</div>`;
  } else { // updates
    const ids=[...state.updates];
    body.innerHTML = ids.length ? `<div class="lib-list">${ids.map(id=>{
      const p=byId(id);
      return `<div class="lib-row">
        <div class="tile" style="${grad(p.grad)}">${ICONS[p.icon]}</div>
        <div class="lib-main" onclick="openSheet('${id}')">
          <div class="lib-name">${p.name}${p.verified?vcheck():""}</div>
          <div class="lib-sub">v${p.version} → next</div>
        </div>
        <button class="txt-btn primary" onclick="applyUpdate('${id}', event)">Update</button>
      </div>`;}).join("")}</div>`
    : `<div class="empty"><b>Everything is up to date.</b>Updates appear here when a registry publishes a newer version.</div>`;
  }
}

function setView(v){ state.view=v; state.q=""; $("q").value=""; render(); }

function openSheet(id){
  const p = byId(id);
  const installed = state.installed.has(id);
  $("sheet").innerHTML = `<div class="sheet-pad">
    <div class="sheet-head">
      <div class="tile" style="${grad(p.grad)}">${ICONS[p.icon]}</div>
      <div class="sheet-titles">
        <h3>${p.name}${p.verified?vcheck():""}</h3>
        <div class="by">by ${p.author} · ${p.cat}</div>
      </div>
      <button class="sheet-x" onclick="closeSheet()">✕</button>
    </div>
    <div class="meta-grid">
      <div><div class="k">Installs</div><div class="v">${p.installs}</div></div>
      <div><div class="k">Version</div><div class="v" style="font-family:var(--mono);font-weight:500">${p.version}</div></div>
      <div><div class="k">Updated</div><div class="v">${p.updated}</div></div>
      <div><div class="k">License</div><div class="v">${p.license}</div></div>
    </div>
    <div class="sheet-desc">${p.desc.map(d=>`<p>${d}</p>`).join("")}</div>
    <div class="sub-h">Extends</div>
    <div class="ext">${p.ext.map(e=>`<code>${e}</code>`).join("")}</div>
    <div class="sheet-cta-row">
      ${installed
        ? `<button class="txt-btn grow" style="height:42px" onclick="uninstall('${p.id}');closeSheet()">Uninstall</button>
           <button class="txt-btn primary grow" style="height:42px;opacity:.55;cursor:default">Installed ✓</button>`
        : `<button class="txt-btn grow" style="height:42px" onclick="toast('Loaded ${p.name} for this session only — try it out');closeSheet()">Try it</button>
           <button class="txt-btn primary grow" style="height:42px" onclick="install('${p.id}');closeSheet()">Install</button>`}
    </div>
  </div>`;
  $("overlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeSheet(){ $("overlay").classList.remove("open"); document.body.style.overflow=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeSheet(); });

render();
</script>
</body>
</html>
